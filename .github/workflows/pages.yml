name: pages

# Publishes the UI to GitHub Pages whenever main changes (e.g. a merged PR).
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Where the hosted API lives, e.g. https://floored-api.fly.dev
          # (Settings → Secrets and variables → Actions → Variables).
          VITE_API_URL: ${{ vars.FLOORED_API_URL }}
          # Public Mapbox token (pk.…); restrict it to this site's URL in your Mapbox account.
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN || vars.MAPBOX_TOKEN }}
      # Pages has no SPA routing; serving index.html as the 404 page makes deep links work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
