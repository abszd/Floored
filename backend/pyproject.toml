[project]
name = "floored"
version = "0.1.0"
description = "Find floor plans on the web, convert them to rooms, and place them on a map."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.9",
    "shapely>=2.0",
    "pypdfium2>=4.25",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
floored = "floored.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["floored*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
